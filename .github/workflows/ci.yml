name: Foundation CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  web-foundation:
    name: web-foundation-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web:e2e
  foundation:
    name: foundation-checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: shango
          POSTGRES_DB: shango_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shango -d shango_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://shango:ci-only-password@localhost:5432/shango_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-jwt-secret-not-for-production-123456
      OTP_SECRET: ci-only-otp-secret-not-for-production-654321
      OTP_PROVIDER: development
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - run: npx expo export --platform android --output-dir dist-ci
        working-directory: apps/customer
      - run: npx expo export --platform android --output-dir dist-ci
        working-directory: apps/driver
  web-cross-browser:
    name: web-cross-browser
    runs-on: ubuntu-latest
    env:
      PW_CROSS_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test --project=firefox --project=webkit --project=webkit-mobile
  web-e2e-real:
    name: web-contract-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: shango
          POSTGRES_DB: shango_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shango -d shango_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://shango:ci-only-password@localhost:5432/shango_test
      REDIS_URL: redis://localhost:6379/14
      JWT_SECRET: ci-only-jwt-secret-not-for-production-123456
      OTP_SECRET: ci-only-otp-secret-not-for-production-654321
      OTP_PROVIDER: development
      CORS_ORIGINS: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web:e2e:real
  images:
    name: docker-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/api.Dockerfile -t shango/api:${{ github.sha }} .
      - run: docker build -f deploy/web.Dockerfile -t shango/web:${{ github.sha }} .
      - name: Validate Caddyfile and staging compose
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e CUSTOMER_HOST=customer.example.test -e DRIVER_HOST=driver.example.test \
            -e ADMIN_HOST=admin.example.test -e STAGING_ALLOWED_CIDRS=10.0.0.0/8 \
            shango/web:${{ github.sha }} caddy validate --config /etc/caddy/Caddyfile
          cp deploy/staging.env.example deploy/ci.env
          sed -i 's/^\([A-Z_]*_SECRET\|POSTGRES_PASSWORD\|METRICS_TOKEN\)=$/\1=ci-placeholder-value-not-a-secret-0123456789/' deploy/ci.env
          docker compose -f deploy/compose.staging.yaml --env-file deploy/ci.env --profile monitoring config --quiet
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro" -w /p prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro" -w /p prom/prometheus:v3.5.0 test rules alerts.test.yml
