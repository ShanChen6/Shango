openapi: 3.0.3
info:
  title: ShanGo Foundation API
  version: 0.1.0
  description: Development-only foundation. No production SMS, orders, tracking or ledger yet.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: Auth
  - name: Drivers
  - name: Admin
paths:
  /health/live:
    get:
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      responses:
        '200': { description: PostGIS, migration and Redis ready }
        '503': { description: Dependency unavailable }
  /auth/otp/request:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, role]
              additionalProperties: false
              properties:
                phone: { type: string, example: '+84901234567' }
                role: { type: string, enum: [customer, driver] }
      responses:
        '200':
          description: Development challenge, expires in 180 seconds
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresIn: { type: integer }
                  devCode: { type: string, description: Never enable this provider in production }
        '400': { description: Invalid input }
        '429': { description: Rate limit or cooldown }
  /auth/otp/verify:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { description: Invalid OTP or inactive account }
        '429': { description: Too many verification attempts }
  /auth/refresh:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 32, maxLength: 200 }
      responses:
        '200':
          description: Previous refresh consumed; replacement issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { description: Expired, revoked or already rotated }
  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current active account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Invalid or revoked session }
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Current session revoked }
        '401': { description: Invalid session }
  /drivers/me:
    get:
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile or null if not submitted
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/DriverProfile' }]
                nullable: true
        '403': { description: Driver role required }
    post:
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vehiclePlate, vehicleType]
              properties:
                vehiclePlate: { type: string, minLength: 4, maxLength: 20 }
                vehicleType: { type: string, enum: [motorcycle, car] }
      responses:
        '201':
          description: Profile submitted for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverProfile' }
        '403': { description: Driver role required }
        '409': { description: Approved profile cannot be changed through this API }
  /drivers/me/availability:
    patch:
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              additionalProperties: false
              properties:
                available: { type: boolean }
      responses:
        '200': { description: Offline confirmed }
        '403': { description: Approval required }
        '409': { description: Online not implemented until SG-018 }
  /admin/drivers:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: Fixed page size 20; admin or dispatcher only
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/DriverProfile' }
                        - type: object
                          properties:
                            phone: { type: string }
                            displayName: { type: string, nullable: true }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '403': { description: Insufficient role }
  /admin/drivers/{id}/review:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, expectedUpdatedAt]
              properties:
                status: { type: string, enum: [approved, rejected] }
                reason:
                  {
                    type: string,
                    minLength: 3,
                    maxLength: 500,
                    description: Required when rejected,
                  }
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Review committed together with audit log
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverProfile' }
        '400': { description: Invalid request }
        '403': { description: Insufficient role }
        '404': { description: Profile not found }
        '409': { description: Stale or already reviewed profile; reload }
  /users/me:
    get:
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile for the current active account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { description: Invalid or inactive session }
    patch:
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, expectedVersion]
              properties:
                displayName:
                  {
                    type: string,
                    minLength: 2,
                    maxLength: 80,
                    description: NFC normalized; no control characters,
                  }
                expectedVersion: { type: integer, minimum: 0, maximum: 2147483646 }
      responses:
        '200':
          description: Updated profile, or unchanged profile without version/event duplication
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { description: Invalid input or protected fields supplied }
        '401': { description: Invalid or inactive session }
        '409': { description: Profile version changed; reload before saving }
  /admin/audit-logs:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema:
            {
              type: string,
              pattern: '^[1-9][0-9]{0,18}$',
              description: Previous nextCursor; preserve exact string value,
            }
        - in: query
          name: actorId
          schema: { type: string, format: uuid }
        - in: query
          name: entityId
          schema: { type: string, format: uuid }
        - in: query
          name: action
          schema: { type: string, enum: [user.profile.updated, driver.review, admin.bootstrap] }
        - in: query
          name: from
          schema: { type: string, format: date-time, description: Inclusive lower bound }
        - in: query
          name: to
          schema:
            {
              type: string,
              format: date-time,
              description: Exclusive upper bound; must be after from,
            }
      responses:
        '200':
          description: Admin-only cursor page ordered by descending event ID
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  nextCursor: { type: string, nullable: true }
        '400': { description: Invalid query or cursor }
        '401': { description: Invalid or inactive session }
        '403': { description: Admin role required }
  /maps/config:
    get:
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Hanoi discovery rectangle, configuration availability and attribution; does not expose provider URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  region: { type: object }
                  geocodingConfigured: { type: boolean }
                  routingConfigured: { type: boolean }
                  searchMode: { type: string, enum: [submit-only] }
                  attribution: { type: string }
                  attributionUrl: { type: string, format: uri }
                  routingProfile: { type: string }
        '401': { description: Authentication required }
  /maps/search:
    get:
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 3, maxLength: 160 }
      responses:
        '200':
          description: At most five Hanoi results; submit-only, no autocomplete
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    maxItems: 5
                    items: { $ref: '#/components/schemas/MapPlace' }
                  provider: { type: string, enum: [nominatim] }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '429': { description: User quota or global geocoder admission limit }
        '502': { description: Upstream unavailable or malformed response }
        '503': { description: Provider not configured }
  /maps/reverse:
    get:
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: longitude
          required: true
          schema: { type: number, minimum: 105.3, maximum: 106.05 }
        - in: query
          name: latitude
          required: true
          schema: { type: number, minimum: 20.55, maximum: 21.4 }
      responses:
        '200':
          description: Nearest address and original selected point separately; do not move the pin to the address
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/MapPlace' }
                  requestedPosition: { $ref: '#/components/schemas/Coordinate' }
                  provider: { type: string, enum: [nominatim] }
        '400': { description: Outside pilot rectangle or invalid coordinates }
        '401': { description: Authentication required }
        '404': { description: No Hanoi address found }
        '429': { description: User quota or global geocoder admission limit }
        '502': { description: Upstream unavailable or malformed response }
        '503': { description: Provider not configured }
  /maps/route:
    get:
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: pickupLng
          required: true
          schema: { type: number, minimum: 105.3, maximum: 106.05 }
        - in: query
          name: pickupLat
          required: true
          schema: { type: number, minimum: 20.55, maximum: 21.4 }
        - in: query
          name: dropoffLng
          required: true
          schema: { type: number, minimum: 105.3, maximum: 106.05 }
        - in: query
          name: dropoffLat
          required: true
          schema: { type: number, minimum: 20.55, maximum: 21.4 }
      responses:
        '200':
          description: OSRM driving route; no price and no straight-line fallback; motorcycle routing unverified
          content:
            application/json:
              schema:
                type: object
                properties:
                  distanceMeters: { type: number, minimum: 0 }
                  durationSeconds: { type: number, minimum: 0 }
                  geometry:
                    type: object
                    properties:
                      type: { type: string, enum: [LineString] }
                      coordinates:
                        type: array
                        items:
                          type: array
                          minItems: 2
                          maxItems: 2
                          items: { type: number }
                  provider: { type: string, enum: [osrm] }
                  profile: { type: string, enum: [driving] }
                  motorcycleValidated: { type: boolean, enum: [false] }
        '400': { description: Outside pilot rectangle or invalid coordinates }
        '401': { description: Authentication required }
        '404': { description: No route or no nearby road segment }
        '429': { description: Quota exceeded }
        '502': { description: Upstream unavailable or malformed response }
        '503': { description: OSRM not configured }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    UserProfile:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          required: [version, updatedAt]
          properties:
            version: { type: integer, minimum: 0 }
            updatedAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, actorId, actorDisplayName, action, entityType, entityId, metadata, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string, format: uuid }
        actorDisplayName:
          { type: string, nullable: true, description: Current name; not a historic name snapshot }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        metadata:
          {
            type: object,
            description: Whitelisted fields for supported actions; empty object for unknown actions,
          }
        createdAt: { type: string, format: date-time }
    Coordinate:
      type: object
      required: [longitude, latitude]
      properties:
        longitude: { type: number }
        latitude: { type: number }
    MapPlace:
      type: object
      required: [id, label, position]
      properties:
        id: { type: string }
        label: { type: string }
        position: { $ref: '#/components/schemas/Coordinate' }
    User:
      type: object
      required: [id, phone, role, displayName]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        role: { type: string, enum: [customer, driver, admin, dispatcher, accountant] }
        displayName: { type: string, nullable: true }
    Session:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }
    DriverProfile:
      type: object
      required: [userId, vehiclePlate, vehicleType, status, rejectionReason, updatedAt]
      properties:
        userId: { type: string, format: uuid }
        vehiclePlate: { type: string }
        vehicleType: { type: string, enum: [motorcycle, car] }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectionReason: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
