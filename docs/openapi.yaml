openapi: 3.0.3
info:
  title: ShanGo Foundation API
  version: 0.1.0
  description: Development-only foundation. No production SMS, orders, tracking or ledger yet.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: Auth
  - name: Drivers
  - name: Admin
  - name: Orders
  - name: Ops
paths:
  /health/live:
    get:
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      responses:
        '200': { description: 'PostGIS, migration and Redis ready' }
        '503': { description: Dependency unavailable }
  /auth/otp/request:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, role]
              additionalProperties: false
              properties:
                phone: { type: string, example: '+84901234567' }
                role: { type: string, enum: [customer, driver] }
      responses:
        '200':
          description: Development challenge, expires in 180 seconds
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresIn: { type: integer }
                  devCode: { type: string, description: Never enable this provider in production }
        '400': { description: Invalid input }
        '429': { description: Rate limit or cooldown }
  /auth/otp/verify:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { description: Invalid OTP or inactive account }
        '429': { description: Too many verification attempts }
  /auth/refresh:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 32, maxLength: 200 }
      responses:
        '200':
          description: Previous refresh consumed; replacement issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { description: 'Expired, revoked or already rotated' }
  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current active account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Invalid or revoked session }
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Current session revoked }
        '400': { description: Mixed credentials (web refresh cookie present) }
        '401': { description: Invalid session }
  /auth/web/otp/request:
    post:
      tags: [Auth]
      description: >-
        Web transport (ADR-002). Requires an exact allowlisted Origin. Role is derived from `app`;
        the Admin app never registers accounts. 503 when WEB_AUTH_ENABLED=false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, app]
              properties:
                phone: { type: string, example: '+84901234567' }
                app: { type: string, enum: [customer, driver, admin] }
      responses:
        '200': { description: Challenge created (devCode only with the development provider) }
        '403': { description: Origin not allowed }
        '429': { description: Rate limited }
        '503': { description: Web auth disabled; clears refresh cookie }
  /auth/web/otp/verify:
    post:
      tags: [Auth]
      description: >-
        Sets `__Host-shango-refresh` (Secure; HttpOnly; SameSite=Lax; Path=/). The refresh token is
        never returned in JSON. Wrong app/role fails before any session is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code, app]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
                app: { type: string, enum: [customer, driver, admin] }
      responses:
        '200':
          description: Access token, CSRF token and user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSession' }
        '401': { description: Invalid/expired OTP or account not usable in this app (generic) }
        '403': { description: Origin not allowed }
  /auth/web/csrf:
    get:
      tags: [Auth]
      description: 'Authenticated by the refresh cookie. Cache-Control: no-store.'
      responses:
        '200':
          description: Session-bound CSRF token
          content:
            application/json:
              schema: { type: object, properties: { csrfToken: { type: string } } }
        '401': { description: No live web session }
        '403': { description: Origin present but not allowed }
  /auth/web/refresh:
    post:
      tags: [Auth]
      description: 'Requires refresh cookie, exact Origin and X-CSRF-Token. Rotates the cookie atomically.'
      parameters:
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      responses:
        '200':
          description: New access token; rotated cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSession' }
        '400': { description: Body or Authorization header present (mixed credentials) }
        '401': { description: 'Missing, rotated, revoked or expired session' }
        '403': { description: Invalid CSRF token or Origin }
  /auth/web/logout:
    post:
      tags: [Auth]
      description: >-
        CSRF is checked before a live session is revoked; on failure nothing is revoked or cleared.
        Absent/dead cookies are cleared idempotently.
      parameters:
        - { in: header, name: X-CSRF-Token, required: false, schema: { type: string } }
      responses:
        '204': { description: Session revoked (if live) and cookie cleared }
        '403': { description: Invalid CSRF token or Origin }
  /drivers/me:
    get:
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile or null if not submitted
          content:
            application/json:
              schema:
                type: object
                allOf: [{ $ref: '#/components/schemas/DriverProfile' }]
                nullable: true
        '403': { description: Driver role required }
    post:
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vehiclePlate, vehicleType]
              properties:
                vehiclePlate: { type: string, minLength: 4, maxLength: 20 }
                vehicleType: { type: string, enum: [motorcycle, car] }
      responses:
        '201':
          description: Profile submitted for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverProfile' }
        '403': { description: Driver role required }
        '409': { description: Approved profile cannot be changed through this API }
  /admin/drivers:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: Fixed page size 20; admin or dispatcher only
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/DriverProfile' }
                        - type: object
                          properties:
                            phone: { type: string }
                            displayName: { type: string, nullable: true }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '403': { description: Insufficient role }
  /admin/drivers/{id}/review:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, expectedUpdatedAt]
              properties:
                status: { type: string, enum: [approved, rejected] }
                reason:
                  {
                    type: string,
                    minLength: 3,
                    maxLength: 500,
                    description: Required when rejected,
                  }
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Review committed together with audit log
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverProfile' }
        '400': { description: Invalid request }
        '403': { description: Insufficient role }
        '404': { description: Profile not found }
        '409':
          description: 'Stale/already reviewed profile, missing required images or missing inspections of the current revision'
  /admin/drivers/{id}/reopen:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expectedUpdatedAt]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        '201':
          description: Approved profile reopened as pending, availability disabled and action audited; Admin only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverProfile' }
        '400': { description: Reason or revision invalid }
        '401': { description: Invalid session }
        '403': { description: Admin required; dispatchers cannot reopen }
        '404': { description: Profile not found }
        '409': { description: Stale revision or profile not approved }
  /drivers/me/documents:
    get:
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current document set and matching profile revision; driver role only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverDocuments' }
        '401': { description: Invalid session }
        '403': { description: Driver role required }
        '404': { description: Submit vehicle profile first }
    post:
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [kind, expectedUpdatedAt, file]
              properties:
                kind: { $ref: '#/components/schemas/DocumentKind' }
                expectedUpdatedAt: { type: string, format: date-time }
                file:
                  {
                    type: string,
                    format: binary,
                    description: JPEG or PNG up to 5 MiB; decoded and normalized to JPEG without source metadata,
                  }
      responses:
        '201':
          description: New current document and updated pending profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/DriverDocument' }
                  profile: { $ref: '#/components/schemas/DriverProfile' }
        '400': { description: Invalid image or multipart fields }
        '401': { description: Invalid session }
        '403': { description: Driver role required }
        '409': { description: 'Stale revision, missing vehicle profile or approved profile locked' }
        '413': { description: Image exceeds 5 MiB }
        '429': { description: Upload quota or capacity exceeded }
        '503': { description: Private storage unavailable }
  /admin/drivers/{id}/documents:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Admin/dispatcher snapshot and IDs inspected by the current reviewer in the current profile revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverDocuments' }
        '401': { description: Invalid session }
        '403': { description: Admin or dispatcher required }
        '404': { description: Profile not found }
  /driver-documents/{id}/content:
    get:
      tags: [Drivers]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Private normalized image for owning driver or admin/dispatcher; successful read creates an inspection event
          headers:
            Cache-Control:
              schema: { type: string, example: 'private, no-store, max-age=0' }
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="identity_front.jpg"' }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { description: Invalid session }
        '404': { description: 'Not found, superseded or inaccessible' }
        '429': { description: Content read quota exceeded }
        '503': { description: Storage or integrity check failed }
  /users/me:
    get:
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile for the current active account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { description: Invalid or inactive session }
    patch:
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, expectedVersion]
              properties:
                displayName:
                  {
                    type: string,
                    minLength: 2,
                    maxLength: 80,
                    description: NFC normalized; no control characters,
                  }
                expectedVersion: { type: integer, minimum: 0, maximum: 2147483646 }
      responses:
        '200':
          description: Updated profile, or unchanged profile without version/event duplication
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { description: Invalid input or protected fields supplied }
        '401': { description: Invalid or inactive session }
        '409': { description: Profile version changed; reload before saving }
  /admin/audit-logs:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema:
            {
              type: string,
              pattern: '^[1-9][0-9]{0,18}$',
              description: Previous nextCursor; preserve exact string value,
            }
        - in: query
          name: actorId
          schema: { type: string, format: uuid }
        - in: query
          name: entityId
          schema: { type: string, format: uuid }
        - in: query
          name: action
          schema:
            {
              type: string,
              enum:
                [
                  user.profile.updated,
                  driver.review,
                  admin.bootstrap,
                  driver.document.uploaded,
                  driver.document.viewed,
                  driver.review.reopened,
                ],
            }
        - in: query
          name: from
          schema: { type: string, format: date-time, description: Inclusive lower bound }
        - in: query
          name: to
          schema:
            {
              type: string,
              format: date-time,
              description: Exclusive upper bound; must be after from,
            }
      responses:
        '200':
          description: Admin-only cursor page ordered by descending event ID
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  nextCursor: { type: string, nullable: true }
        '400': { description: Invalid query or cursor }
        '401': { description: Invalid or inactive session }
        '403': { description: Admin role required }
  /maps/config:
    get:
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Hanoi discovery rectangle, configuration availability and attribution; does not expose provider URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  region: { type: object }
                  geocodingConfigured: { type: boolean }
                  routingConfigured: { type: boolean }
                  searchMode: { type: string, enum: [submit-only] }
                  attribution: { type: string }
                  attributionUrl: { type: string, format: uri }
                  routingProfile: { type: string }
        '401': { description: Authentication required }
  /maps/search:
    get:
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 3, maxLength: 160 }
      responses:
        '200':
          description: At most five Hanoi results; submit-only, no autocomplete
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    maxItems: 5
                    items: { $ref: '#/components/schemas/MapPlace' }
                  provider: { type: string, enum: [nominatim] }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '429': { description: User quota or global geocoder admission limit }
        '502': { description: Upstream unavailable or malformed response }
        '503': { description: Provider not configured }
  /maps/reverse:
    get:
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: longitude
          required: true
          schema: { type: number, minimum: 105.3, maximum: 106.05 }
        - in: query
          name: latitude
          required: true
          schema: { type: number, minimum: 20.55, maximum: 21.4 }
      responses:
        '200':
          description: Nearest address and original selected point separately; do not move the pin to the address
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/MapPlace' }
                  requestedPosition: { $ref: '#/components/schemas/Coordinate' }
                  provider: { type: string, enum: [nominatim] }
        '400': { description: Outside pilot rectangle or invalid coordinates }
        '401': { description: Authentication required }
        '404': { description: No Hanoi address found }
        '429': { description: User quota or global geocoder admission limit }
        '502': { description: Upstream unavailable or malformed response }
        '503': { description: Provider not configured }
  /maps/route:
    get:
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: pickupLng
          required: true
          schema: { type: number, minimum: 105.3, maximum: 106.05 }
        - in: query
          name: pickupLat
          required: true
          schema: { type: number, minimum: 20.55, maximum: 21.4 }
        - in: query
          name: dropoffLng
          required: true
          schema: { type: number, minimum: 105.3, maximum: 106.05 }
        - in: query
          name: dropoffLat
          required: true
          schema: { type: number, minimum: 20.55, maximum: 21.4 }
      responses:
        '200':
          description: OSRM driving route; no price and no straight-line fallback; motorcycle routing unverified
          content:
            application/json:
              schema:
                type: object
                properties:
                  distanceMeters: { type: number, minimum: 0 }
                  durationSeconds: { type: number, minimum: 0 }
                  geometry:
                    type: object
                    properties:
                      type: { type: string, enum: [LineString] }
                      coordinates:
                        type: array
                        items:
                          type: array
                          minItems: 2
                          maxItems: 2
                          items: { type: number }
                  provider: { type: string, enum: [osrm] }
                  profile: { type: string, enum: [driving] }
                  motorcycleValidated: { type: boolean, enum: [false] }
        '400': { description: Outside pilot rectangle or invalid coordinates }
        '401': { description: Authentication required }
        '404': { description: No route or no nearby road segment }
        '429': { description: Quota exceeded }
        '502': { description: Upstream unavailable or malformed response }
        '503': { description: OSRM not configured }
  /orders/quote:
    post:
      tags: [Orders]
      summary: Pilot quote from the OSRM route distance (integer VND, not PO-approved pricing)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Quote valid for 10 minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '403': { description: Not a customer }
        '422':
          { description: Pickup or dropoff outside every active service area (message names which) }
        '429': { description: Rate limited }
        '503':
          {
            description: 'Orders disabled, tariff missing for the vehicle type, or routing not configured',
          }
  /orders:
    get:
      tags: [Orders]
      summary: The customer's 50 most recent orders
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Order' } }
    post:
      tags: [Orders]
      summary: Create an order from a quote (idempotent per quoteId)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quoteId]
              properties: { quoteId: { type: string, format: uuid } }
      responses:
        '201':
          description: Created, or the existing order for the same quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { description: Quote not found for this customer }
        '409': { description: Quote expired or too many open orders }
        '422': { description: A stop is no longer inside an active service area }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Order snapshot (owner customer, assigned driver or staff)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { description: Not found or not readable by this account }
  /orders/{id}/events:
    get:
      tags: [Orders]
      summary: Status timeline (owner customer, assigned driver or staff)
      description: >-
        Ordered by version. `actor` is customer, driver, staff (admin/dispatcher) or system
        (dispatch expiry). `actorId` is only returned to staff.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrderEvent' } }
        '404': { description: Not found or not readable by this account }
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Customer cancels while SEARCHING
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersion' }
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { description: Version changed or status no longer cancellable }
  /drivers/me/location:
    post:
      tags: [Drivers]
      summary: Foreground GPS fix (also via Socket.IO event driver:location)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [longitude, latitude, accuracy, sequence, recordedAt]
              properties:
                longitude: { type: number, minimum: -180, maximum: 180 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                accuracy: { type: number, minimum: 0, maximum: 5000 }
                sequence: { type: integer, minimum: 1 }
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: 'Accepted, or rejected with reason stale | future | inaccurate | out-of-order | throttled (max 1 stored fix per second)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
                  reason: { type: string }
        '403': { description: Driver not approved }
  /drivers/me/presence:
    get:
      tags: [Drivers]
      summary: Availability and GPS freshness as seen by the server
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Presence
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  lastSeenAt: { type: string, format: date-time, nullable: true }
                  accuracy: { type: integer, nullable: true }
                  fresh: { type: boolean }
  /drivers/me/availability:
    patch:
      tags: [Drivers]
      summary: Go online (needs approval and a fix under 30s) or offline (withdraws pending offers)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [available]
              properties: { available: { type: boolean } }
      responses:
        '200': { description: New availability }
        '403': { description: Driver approval required }
        '409': { description: No fresh GPS fix }
        '503': { description: Orders disabled }
  /drivers/me/offers/current:
    get:
      tags: [Drivers]
      summary: Pending offer for this driver (addresses only, no contact phones)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: '{ offer: DriverOffer | null }' }
  /drivers/me/offers/{id}/accept:
    post:
      tags: [Drivers]
      summary: Accept a live offer; exactly one concurrent accept wins
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Assigned order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          {
            description: 'Offer expired/withdrawn, order no longer searching, or driver already busy',
          }
  /drivers/me/offers/{id}/decline:
    post:
      tags: [Drivers]
      summary: Decline; dispatch offers the next driver
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Declined }
        '409': { description: Offer no longer live }
  /drivers/me/orders/current:
    get:
      tags: [Drivers]
      summary: The driver's active order with contacts
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: '{ order: Order | null }' }
  /drivers/me/orders/{id}/status:
    post:
      tags: [Drivers]
      summary: Advance one step (ASSIGNED → AT_PICKUP → PICKED_UP → IN_TRANSIT → DELIVERED)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, expectedVersion]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { description: Not assigned to this driver }
        '409': { description: Version changed or invalid transition }
  /admin/orders:
    get:
      tags: [Admin]
      summary: 100 most recent orders, optionally filtered by status (admin, dispatcher)
      security: [{ bearerAuth: [] }]
      parameters:
        [
          {
            in: query,
            name: status,
            required: false,
            schema: { $ref: '#/components/schemas/OrderStatus' },
          },
        ]
      responses:
        '200': { description: '{ items: Order[] }' }
  /admin/orders/{id}/cancel:
    post:
      tags: [Admin]
      summary: Staff cancel before pickup with a reason (audited)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, reason]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200': { description: Cancelled order }
        '409': { description: Version changed or picked up already }
  /admin/service-areas:
    get:
      tags: [Admin]
      summary: Service areas (SG-015) with GeoJSON geometry; admin and dispatcher
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Areas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ServiceArea' } }
  /admin/service-areas/{id}:
    put:
      tags: [Admin]
      summary: Replace an area's shape, name and active flag (admin only, versioned, audited)
      description: >-
        Coordinates are [longitude, latitude]. Rings must be closed, every vertex inside the Hanoi
        discovery rectangle, at most 2000 vertices; PostGIS rejects self-intersections. At least
        one area must stay active.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAreaUpdate' }
      responses:
        '200':
          description: Saved area (version + 1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceArea' }
        '400':
          { description: Malformed GeoJSON, open ring, outside the rectangle or too many vertices }
        '403': { description: Not an admin }
        '409': { description: Version changed, or this would deactivate the last active area }
        '422': { description: Invalid polygon (PostGIS reason in message) or zero area }
  /admin/service-areas/{id}/versions:
    get:
      tags: [Admin]
      summary: Saved revisions of an area, newest first (max 50)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Revisions with version, name, active, vertices, areaKm2, changedAt }
  /health/metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics; requires Bearer METRICS_TOKEN; blocked at the Caddy edge
      responses:
        '200': { description: text/plain exposition format }
        '401': { description: Missing or wrong token }
        '404': { description: METRICS_TOKEN not configured }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    OrderStatus:
      type: string
      enum: [SEARCHING, ASSIGNED, AT_PICKUP, PICKED_UP, IN_TRANSIT, DELIVERED, CANCELLED, EXPIRED]
    AreaGeometry:
      type: object
      description: GeoJSON Polygon or MultiPolygon, positions as [longitude, latitude]
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon, MultiPolygon] }
        coordinates: { type: array, items: {} }
    ServiceArea:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        active: { type: boolean }
        version: { type: integer }
        geometry: { $ref: '#/components/schemas/AreaGeometry' }
        areaKm2: { type: integer }
        vertices: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid, nullable: true }
    ServiceAreaUpdate:
      type: object
      additionalProperties: false
      required: [name, active, geometry, expectedVersion]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        active: { type: boolean }
        geometry: { $ref: '#/components/schemas/AreaGeometry' }
        expectedVersion: { type: integer, minimum: 1 }
    OrderEvent:
      type: object
      required: [version, status, at, reason, actor]
      properties:
        version: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { type: string, format: date-time }
        reason: { type: string, nullable: true }
        actor: { type: string, enum: [customer, driver, staff, system] }
        actorId: { type: string, format: uuid, nullable: true, description: Staff only }
    ExpectedVersion:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties: { expectedVersion: { type: integer, minimum: 1 } }
    OrderStop:
      type: object
      required: [position, address, contactName, contactPhone]
      properties:
        position:
          type: object
          properties: { longitude: { type: number }, latitude: { type: number } }
        address: { type: string, maxLength: 500 }
        detail: { type: string, maxLength: 200 }
        contactName: { type: string, minLength: 2, maxLength: 80 }
        contactPhone: { type: string, description: 'VN 0xxxxxxxxx or E.164; normalized to E.164' }
        note: { type: string, maxLength: 500 }
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [vehicleType, pickup, dropoff]
      properties:
        vehicleType: { type: string, enum: [motorcycle, car] }
        pickup: { $ref: '#/components/schemas/OrderStop' }
        dropoff: { $ref: '#/components/schemas/OrderStop' }
    Quote:
      type: object
      properties:
        id: { type: string, format: uuid }
        vehicleType: { type: string, enum: [motorcycle, car] }
        distanceMeters: { type: integer }
        durationSeconds: { type: integer }
        priceVnd: { type: integer, description: Integer VND }
        tariffVersion: { type: string }
        pricingApproved: { type: boolean, enum: [false] }
        expiresAt: { type: string, format: date-time }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        version: { type: integer }
        vehicleType: { type: string, enum: [motorcycle, car] }
        stops:
          type: object
          properties:
            pickup: { $ref: '#/components/schemas/OrderStop' }
            dropoff: { $ref: '#/components/schemas/OrderStop' }
        distanceMeters: { type: integer }
        durationSeconds: { type: integer }
        priceVnd: { type: integer }
        tariffVersion: { type: string }
        searchDeadline: { type: string, format: date-time }
        cancelReason: { type: string, nullable: true }
        customerId: { type: string, format: uuid }
        driverId: { type: string, format: uuid, nullable: true }
        driver: { type: object, nullable: true }
        driverLocation:
          {
            type: object,
            nullable: true,
            description: Last known position while the order is active,
          }
    WebSession:
      type: object
      required: [accessToken, csrfToken, user]
      properties:
        accessToken: { type: string, description: 'JWT, 15 minutes, keep in memory only' }
        csrfToken: { type: string, description: 'HMAC bound to the session id' }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            phone: { type: string }
            role: { type: string, enum: [customer, driver, admin, dispatcher, accountant] }
            displayName: { type: string, nullable: true }
    DocumentKind:
      type: string
      enum: [identity_front, identity_back, driver_license, vehicle_registration]
    DriverDocument:
      type: object
      required: [id, driverId, kind, contentType, byteSize, createdAt]
      properties:
        id: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        contentType: { type: string, enum: [image/jpeg] }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        createdAt: { type: string, format: date-time }
    DriverDocuments:
      type: object
      required: [items, profile, requiredKinds, viewedIds]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DriverDocument' }
        profile: { $ref: '#/components/schemas/DriverProfile' }
        requiredKinds:
          type: array
          items: { $ref: '#/components/schemas/DocumentKind' }
        viewedIds:
          type: array
          items: { type: string, format: uuid }
    UserProfile:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          required: [version, updatedAt]
          properties:
            version: { type: integer, minimum: 0 }
            updatedAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, actorId, actorDisplayName, action, entityType, entityId, metadata, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string, format: uuid }
        actorDisplayName:
          { type: string, nullable: true, description: Current name; not a historic name snapshot }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        metadata:
          {
            type: object,
            description: Whitelisted fields for supported actions; empty object for unknown actions,
          }
        createdAt: { type: string, format: date-time }
    Coordinate:
      type: object
      required: [longitude, latitude]
      properties:
        longitude: { type: number }
        latitude: { type: number }
    MapPlace:
      type: object
      required: [id, label, position]
      properties:
        id: { type: string }
        label: { type: string }
        position: { $ref: '#/components/schemas/Coordinate' }
    User:
      type: object
      required: [id, phone, role, displayName]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        role: { type: string, enum: [customer, driver, admin, dispatcher, accountant] }
        displayName: { type: string, nullable: true }
    Session:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }
    DriverProfile:
      type: object
      required: [userId, vehiclePlate, vehicleType, status, rejectionReason, updatedAt]
      properties:
        userId: { type: string, format: uuid }
        vehiclePlate: { type: string }
        vehicleType: { type: string, enum: [motorcycle, car] }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectionReason: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
