# Scrapes the API on the private compose network (the edge returns 404 for /metrics).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: shango-api
    metrics_path: /api/v1/health/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['api:3000']
